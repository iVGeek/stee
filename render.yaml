services:
  - type: web
    name: stee-counselling
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: stee-db
          property: connectionString
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: WA_NUMBER
        sync: false
      - key: WA_TOKEN
        sync: false
      - key: WA_PHONE_ID
        sync: false
      - key: WA_TO_NUMBER
        sync: false
      - key: MEETING_BASE_URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true

databases:
  - name: stee-db
    plan: free
    databaseName: stee
    user: stee


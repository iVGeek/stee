<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Kizito Moraa Counselling</title>
  <link rel="stylesheet" href="/admin.css" />
</head>
<body>
  <main class="admin-wrap">
    <section id="loginView" class="card">
      <h1>Admin</h1>
      <p class="muted">Enter your admin access token to moderate reviews.</p>
      <form id="loginForm">
        <input id="tokenInput" type="password" autocomplete="current-password" placeholder="Admin token" required />
        <button class="btn" type="submit">Sign in</button>
      </form>
      <p id="loginMsg" class="msg" role="status"></p>
    </section>

    <section id="panelView" class="card" hidden>
      <div class="panel-head">
        <h1>Review moderation</h1>
        <div class="panel-actions">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
          <button class="btn btn-ghost" id="logoutBtn" type="button">Sign out</button>
        </div>
      </div>
      <p id="panelMsg" class="msg" role="status"></p>
      <div id="reviewList" class="review-list"></div>
    </section>

    <section id="slotsCard" class="card" hidden>
      <div class="panel-head">
        <h1>Calendar — lock slots</h1>
        <p class="muted">Block days/times you can't work. Booked times are shown for reference.</p>
      </div>
      <form id="slotForm">
        <input type="date" id="slotDate" required />
        <select id="slotTime" required>
          <option value="">Time…</option>
          <option>Morning (9:00-12:00)</option>
          <option>Afternoon (12:00-15:00)</option>
          <option>Late afternoon (15:00-17:00)</option>
        </select>
        <input type="text" id="slotNote" placeholder="Note (optional)" maxlength="120" />
        <button class="btn" type="submit">Block slot</button>
      </form>
      <p id="slotMsg" class="msg" role="status"></p>
      <div id="slotList" class="slot-list"></div>
    </section>
  </main>

  <script src="/admin.js"></script>
</body>
</html>
